services:
  # --- Base de données Postgres ---
  db:
    image: postgres:15-alpine # Version alpine pour la légèreté
    container_name: product-db
    restart: always
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d product_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistance des données
    networks:
      - logging-network

  # --- Backend Spring Boot (en mode Dev) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: product-backend
    ports:
      - "8080:8080"
      - "5005:5005" # Pour le Debugging distant
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit prête
    environment:
      - SPRING_PROFILES_ACTIVE=integ
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=product_db
      - DB_USER=user
      - DB_PASSWORD=password
      - GRADLE_USER_HOME=/app/.gradle-cache
      - LOGS_SERVER_HOST=static://log-ingestor:50051
    volumes:
      - .:/app
      - /app/build
      - gradle-cache:/cache/.gradle
      - ${HOST_M2_PATH}:/root/.m2:ro
    networks:
      - logging-network

# --- Volumes pour la persistance ---
volumes:
  postgres_data:
  gradle-cache:

networks:
  logging-network:
    name: logging-network # Le nom doit être identique partout
    driver: bridge
services:
  # --- Base de données Postgres ---
  db:
    image: postgres:15-alpine # Version alpine pour la légèreté
    container_name: product-db
    restart: always
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d product_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistance des données

  # --- Backend Spring Boot (en mode Dev) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: product-backend
    ports:
      - "8080:8080"
      - "5005:5005" # Pour le Debugging distant
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit prête
    environment:
      - SPRING_PROFILES_ACTIVE=integ
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=product_db
      - DB_USER=user
      - DB_PASSWORD=password
    volumes:
      - .:/app
      - ~/.gradle:/home/gradle/.gradle

# --- Volumes pour la persistance ---
volumes:
  postgres_data:
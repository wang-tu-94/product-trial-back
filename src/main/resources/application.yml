server:
  port: 8080
  servlet:
    context-path: /api/ms-products
spring:
  application:
    name: ms.products
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:ms_products}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:8w9eK7sVh3FQ2mJ6lP0rXyZtN1bQ4uDkFvHsT2cW+Eo=}

grpc:
  client:
    log-ingestor:
      address: ${LOGS_SERVER_HOST}

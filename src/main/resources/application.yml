spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRED_TIME}

grpc:
  client:
    log-ingestor:
      address: ${LOGS_SERVER_HOST}

name: Deploy product-backend
on:
  push:
    branches:
      - master # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

# Étape 1 : Build de l'image de test et exécution des tests
      - name: Build and Test
        run: |
          docker build -t magnomos/product-backend-test -f Dockerfile.dev .
          docker run -e CI=true magnomos/product-backend-test gradle clean test --no-daemon

# Étape 2 : Build de l'image de production (si les tests passent)
      - name: Build Production Image
        run: docker build -t magnomos/product-backend:latest .

# Étape 3 : Push vers Docker Hub
      - name: Push Image
        run: docker push magnomos/product-backend:latest